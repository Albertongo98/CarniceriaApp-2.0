name: CI

# Compila y corre los tests unitarios en cada push y pull request: la suite llegó a estar rota meses
# sin que nadie lo notara. También deja el APK de depuración como artefacto descargable.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Permiso de ejecución para gradlew
        run: chmod +x gradlew

      - name: Tests unitarios y APK de depuración
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests
          path: app/build/reports/tests/

      - name: APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
